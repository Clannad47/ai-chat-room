[project]
name = "ai-chat-room-backend"
version = "0.1.0"
description = "AI Chat Room backend: multi-user chat rooms with tool-using AI bots"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
